name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5, 8.4]
        laravel: [13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: ^11.2.0

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo, sockets
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: vendor/bin/phpstan --error-format=github

  pint:
    name: pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style
        run: vendor/bin/pint --test

  rector:
    name: rector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run Rector (dry run)
        run: vendor/bin/rector --dry-run --no-progress-bar

  # The suite on Postgres, then the `cross-connection` group, which `phpunit.xml.dist` excludes
  # everywhere else: each connection to SQLite's in-memory database opens a separate database.
  # GitHub runs service containers only on Linux runners, so this job is ubuntu-only.
  postgres:
    name: postgres
    runs-on: ubuntu-latest

    # 22 minutes, and the number is derived rather than picked (#278). Every other job in this
    # workflow finishes well inside its 10, and `mysql` is the tightest at 3.1x its observed
    # maximum; this job's worst COMPLETED run is 426s, so the same multiple is 1331s. At 10 it had
    # no headroom at all: measured across 44 runs, two `postgres` jobs were killed at the budget
    # with every test passing -- 618s on `f9cdfd9` and 607s on `ab801f2` -- while the worst run
    # that finished took 426s and the median took 302s.
    #
    # **A killed job reports no failing test.** The checks panel says only `postgres -> cancelled`,
    # which reads like a failure and is a timeout; `CLAUDE.md` records how to tell them apart.
    # This budget exists to catch a genuine hang, not a slow runner, so it sits far above the
    # slowest runner on record and far below GitHub's own 6-hour ceiling.
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: robot_council
          POSTGRES_USER: robot_council
          POSTGRES_PASSWORD: robot_council
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=robot_council --dbname=robot_council"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: robot_council
      DB_USERNAME: robot_council
      DB_PASSWORD: robot_council
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, intl, fileinfo, sockets
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

      - name: Execute cross-connection tests
        run: vendor/bin/pest --ci --group=cross-connection

  # MySQL, running only the tests whose subject is what an ENGINE does rather than what the package
  # does (#253). #137 dropped the full MySQL job for a measured reason that still holds -- 585s
  # against 168s for `postgres`, rising with every test file added -- and that number is about the
  # whole suite. It is not evidence about the handful of files this job selects.
  #
  # **The argument that made the loss tolerable had a gap, and #247 walked into it.** #137 recorded
  # that `HostKeyComparisonTest`'s behavioral tests run on every engine, so #54's access-control
  # property stayed covered on Postgres. That holds only where the ANSWER is the same on every
  # engine, and comparison semantics are exactly where it is not: `Support\HostUsers` bound an
  # integer against a `varchar(64)`, which matched one row on SQLite and Postgres and every
  # numerically equal row on MySQL and MariaDB -- five developers' GitHub IDs for a lookup of one.
  # An engine-neutral test of that property is green on every engine CI ran, defect or no defect,
  # and it was, for as long as the defect existed.
  #
  # `explicit_defaults_for_timestamp` is turned OFF, which is the mode the OTHER defect this job
  # covers lives in: with it off, the first NOT NULL TIMESTAMP column in a table is given an
  # implicit `DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP`, so an UPDATE silently
  # rewrites it. MySQL 5.7 and MariaDB before 10.10 default it off and both are ordinary production
  # choices; a current image is used and put into that mode deliberately rather than pinning CI to
  # an end-of-life one. The suite asserts the mode rather than trusting the step below, because a
  # `SET GLOBAL` that silently did nothing would leave this job testing the safe configuration and
  # reporting green.
  mysql:
    name: mysql
    runs-on: ubuntu-latest
    # Ten rather than #137's twenty. That timeout was sized for the whole suite, which was
    # cancelled at ten with every step reporting success. This job runs 26 tests, and measured on
    # its first CI run: 21s for the test step, 65s for the whole job including the service
    # container, against 312s for `postgres` on the same run. Ten minutes is generous rather than
    # tight, and the headroom is what an added engine-semantics file spends.
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: robot_council
          MYSQL_USER: robot_council
          MYSQL_PASSWORD: robot_council
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: robot_council
      DB_USERNAME: robot_council
      DB_PASSWORD: robot_council
      # Read by `MySqlSchemaTest`, which asserts the connection really is MySQL and really is in
      # the mode above. Without it, a job whose `DB_CONNECTION` never took effect would run on
      # SQLite, skip every MySQL-only test, and report green.
      ROBOT_COUNCIL_EXPECT_MYSQL: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, intl, fileinfo, sockets
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: List Installed Dependencies
        run: composer show -D

      # Set as a global so every connection the suite opens inherits it. Read back in the same
      # step, and the value is asserted again from inside the suite.
      - name: Turn explicit_defaults_for_timestamp off
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root \
            --execute "SET GLOBAL explicit_defaults_for_timestamp = OFF;"
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root \
            --execute "SELECT @@GLOBAL.explicit_defaults_for_timestamp AS explicit_defaults;"

      # The selection is a Pest group rather than a file list, because a file list lives in this
      # file and a group lives beside the test. `EngineSemanticsGroupGuardTest` derives membership
      # from the gate each test already declares and fails when a gated file omits the group, so
      # forgetting it is a red pull request rather than a job that quietly runs less.
      - name: Execute the engine-semantics tests
        run: vendor/bin/pest --ci --group=engine-semantics

  # The committed stylesheet against a fresh build of its sources, so a view added without a
  # rebuild fails here rather than rendering half-styled in a consuming application.
  stylesheet:
    name: stylesheet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pinned, and `npm ci` rather than `npm install`, because two builds of one source have to
      # produce the same bytes before comparing them means anything. `package-lock.json` is
      # committed for this reason -- see the note in CLAUDE.md on why it is, while composer.lock
      # is not.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install the build toolchain
        run: npm ci

      # The check itself. `npm run check` rebuilds to a temporary file and `cmp`s it against the
      # committed artifact, so this fails when a view or a Tailwind source changed without a
      # rebuild -- the drift that is otherwise invisible, because the page still renders using
      # whatever classes the previous build happened to emit.
      - name: Fail if the committed stylesheet is stale
        run: |
          if ! npm run check; then
            echo "::error file=resources/dist/dashboard.css::The committed stylesheet does not match its sources. Run 'npm run build' and commit resources/dist/dashboard.css."
            exit 1
          fi

      # The acceptance criterion #66 asks to be demonstrated rather than asserted: a check that
      # compares a rebuild against a committed file is only meaningful if the build is
      # deterministic. Two builds on this runner, compared. If they ever differ, this job is
      # measuring the toolchain rather than the content and says so here rather than failing
      # mysteriously on somebody's pull request.
      - name: Show the build is reproducible on this runner
        run: |
          npx tailwindcss --input resources/css/dashboard.css --output /tmp/first.css --minify
          npx tailwindcss --input resources/css/dashboard.css --output /tmp/second.css --minify
          if ! cmp /tmp/first.css /tmp/second.css; then
            echo "::error::Two builds of the same sources differ. This check compares the toolchain, not the artifact."
            exit 1
          fi
          echo "two builds agree: $(wc -c < /tmp/first.css) bytes"

  # The dashboard's accessibility gate (#403): every surface in a real headless Chromium, scanned
  # by axe-core, in both themes. The `browser` group is excluded from every other run, because it
  # needs Playwright and a browser build nothing else here installs. `sockets` is the extension
  # pestphp/pest-plugin-browser requires, which is also why the other jobs' lists carry it: the
  # plugin is a dev dependency, so every job that installs dev dependencies needs it.
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo, sockets
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # `npm ci` installs Playwright at the version package-lock.json pins; the browser it drives
      # is a separate download, with the system libraries it needs on this runner
      - name: Install Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Execute the browser tests
        run: vendor/bin/pest --ci --group=browser

      # The AAA findings are reported rather than enforced, so they are kept where a reader can
      # find them after the run
      - name: Keep the AAA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-aaa
          path: build/axe-aaa.json
          if-no-files-found: ignore

  generator:
    name: generator (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The floor the skill documents, and a current release. The floor is what matters here:
        # the suite is written to run under whatever Python a developer already has, so a
        # 3.10-only construct would otherwise reach `main` and fail for them alone.
        python: ['3.9', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run the release generator's tests
        run: python3 -m unittest discover -s .claude/skills/writing-release-notes -v

  # The one check the `main` ruleset requires. It always runs, and it passes only when every
  # job above succeeded, so a failed, cancelled, or skipped job all block the merge.
  ci-passed:
    name: ci-passed
    if: always()
    needs: [tests, phpstan, pint, rector, postgres, mysql, stylesheet, browser, generator]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          TESTS: ${{ needs.tests.result }}
          PHPSTAN: ${{ needs.phpstan.result }}
          PINT: ${{ needs.pint.result }}
          RECTOR: ${{ needs.rector.result }}
          POSTGRES: ${{ needs.postgres.result }}
          MYSQL: ${{ needs.mysql.result }}
          STYLESHEET: ${{ needs.stylesheet.result }}
          BROWSER: ${{ needs.browser.result }}
          GENERATOR: ${{ needs.generator.result }}
        run: |
          echo "tests=$TESTS phpstan=$PHPSTAN pint=$PINT rector=$RECTOR postgres=$POSTGRES mysql=$MYSQL stylesheet=$STYLESHEET browser=$BROWSER generator=$GENERATOR"
          [ "$TESTS" = success ] && [ "$PHPSTAN" = success ] && [ "$PINT" = success ] && [ "$RECTOR" = success ] && [ "$POSTGRES" = success ] && [ "$MYSQL" = success ] && [ "$STYLESHEET" = success ] && [ "$BROWSER" = success ] && [ "$GENERATOR" = success ]
