name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.5, 8.4]
        laravel: [13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: ^11.2.0

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run PHPStan
        run: vendor/bin/phpstan --error-format=github

  pint:
    name: pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style
        run: vendor/bin/pint --test

  rector:
    name: rector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run Rector (dry run)
        run: vendor/bin/rector --dry-run --no-progress-bar

  # The suite on Postgres, then the `cross-connection` group, which `phpunit.xml.dist` excludes
  # everywhere else: each connection to SQLite's in-memory database opens a separate database.
  # GitHub runs service containers only on Linux runners, so this job is ubuntu-only.
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: robot_council
          POSTGRES_USER: robot_council
          POSTGRES_PASSWORD: robot_council
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=robot_council --dbname=robot_council"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: robot_council
      DB_USERNAME: robot_council
      DB_PASSWORD: robot_council
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, intl, fileinfo
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

      - name: Execute cross-connection tests
        run: vendor/bin/pest --ci --group=cross-connection

  # MySQL with `explicit_defaults_for_timestamp` OFF, which is the mode the defect this job
  # exists for lives in: with it off, the first NOT NULL TIMESTAMP column in a table is given an
  # implicit `DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP`, so an UPDATE silently
  # rewrites it. MySQL 5.7 and MariaDB before 10.10 default it off and both are ordinary
  # production choices; a current image is used and put into that mode deliberately rather than
  # pinning CI to an end-of-life one.
  #
  # The suite asserts the mode rather than trusting the step below, because a `SET GLOBAL` that
  # silently did nothing would leave this job testing the safe configuration and reporting green.
  mysql:
    name: mysql
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: robot_council
          MYSQL_USER: robot_council
          MYSQL_PASSWORD: robot_council
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: robot_council
      DB_USERNAME: robot_council
      DB_PASSWORD: robot_council
      # Read by `MySqlSchemaTest`, which asserts the connection really is MySQL. Without it, a job
      # whose `DB_CONNECTION` never took effect would run on SQLite, skip every MySQL-only test,
      # and report green.
      ROBOT_COUNCIL_EXPECT_MYSQL: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, intl, fileinfo
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: List Installed Dependencies
        run: composer show -D

      # Set as a global so every connection the suite opens inherits it. Read back in the same
      # step, and the value is asserted again from inside the suite.
      - name: Turn explicit_defaults_for_timestamp off
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root \
            --execute "SET GLOBAL explicit_defaults_for_timestamp = OFF;"
          mysql --host=127.0.0.1 --port=3306 --user=root --password=root \
            --execute "SELECT @@GLOBAL.explicit_defaults_for_timestamp AS explicit_defaults;"

      - name: Execute tests
        run: vendor/bin/pest --ci

      - name: Execute cross-connection tests
        run: vendor/bin/pest --ci --group=cross-connection

  # The one check the `main` ruleset requires. It always runs, and it passes only when every
  # job above succeeded, so a failed, cancelled, or skipped job all block the merge.
  stylesheet:
    name: stylesheet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pinned, and `npm ci` rather than `npm install`, because two builds of one source have to
      # produce the same bytes before comparing them means anything. `package-lock.json` is
      # committed for this reason -- see the note in CLAUDE.md on why it is, while composer.lock
      # is not.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install the build toolchain
        run: npm ci

      # The check itself. `npm run check` rebuilds to a temporary file and `cmp`s it against the
      # committed artifact, so this fails when a view or a Tailwind source changed without a
      # rebuild -- the drift that is otherwise invisible, because the page still renders using
      # whatever classes the previous build happened to emit.
      - name: Fail if the committed stylesheet is stale
        run: |
          if ! npm run check; then
            echo "::error file=resources/dist/dashboard.css::The committed stylesheet does not match its sources. Run 'npm run build' and commit resources/dist/dashboard.css."
            exit 1
          fi

      # The acceptance criterion #66 asks to be demonstrated rather than asserted: a check that
      # compares a rebuild against a committed file is only meaningful if the build is
      # deterministic. Two builds on this runner, compared. If they ever differ, this job is
      # measuring the toolchain rather than the content and says so here rather than failing
      # mysteriously on somebody's pull request.
      - name: Show the build is reproducible on this runner
        run: |
          npx tailwindcss --input resources/css/dashboard.css --output /tmp/first.css --minify
          npx tailwindcss --input resources/css/dashboard.css --output /tmp/second.css --minify
          if ! cmp /tmp/first.css /tmp/second.css; then
            echo "::error::Two builds of the same sources differ. This check compares the toolchain, not the artifact."
            exit 1
          fi
          echo "two builds agree: $(wc -c < /tmp/first.css) bytes"

  ci-passed:
    name: ci-passed
    if: always()
    needs: [tests, phpstan, pint, rector, postgres, mysql, stylesheet]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          TESTS: ${{ needs.tests.result }}
          PHPSTAN: ${{ needs.phpstan.result }}
          PINT: ${{ needs.pint.result }}
          RECTOR: ${{ needs.rector.result }}
          POSTGRES: ${{ needs.postgres.result }}
          MYSQL: ${{ needs.mysql.result }}
          STYLESHEET: ${{ needs.stylesheet.result }}
        run: |
          echo "tests=$TESTS phpstan=$PHPSTAN pint=$PINT rector=$RECTOR postgres=$POSTGRES mysql=$MYSQL stylesheet=$STYLESHEET"
          [ "$TESTS" = success ] && [ "$PHPSTAN" = success ] && [ "$PINT" = success ] && [ "$RECTOR" = success ] && [ "$POSTGRES" = success ] && [ "$MYSQL" = success ] && [ "$STYLESHEET" = success ]
